<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>German Learning</title>
    <!--<link rel="stylesheet" href="styles.css"> -->
    <link rel="stylesheet" href="styles.css">
    <header class="top-bar">
        <!--<h2 id="view-title">Home</h2>-->
        <button onclick="buttonSearch()">Search for words</button>
    </header>
</head>

<body>
    <div id="output">

        <div id="word-list" class="hidden">
            <ul id="list-container"></ul>
            <a href="javascript:void(0)" onclick="goHome(event)"
                style="display:inline-block; margin-bottom:15px; text-decoration:none; color:#4a90e2; font-weight:bold;">
                ← Back to Menu
            </a>
        </div>


        <div id="card-container" class="hidden">
            <div class="card">
                <h1 id="card-de"></h1>
                <p><strong>Bulgarian:</strong> <span id="card-bg"></span></p>
                <p><strong>Type:</strong> <span id="card-type"></span></p>


                <div id="extra-row" class="extra-section hidden">
                    <p><strong>Notes:</strong></p>
                    <div id="card-extra" class="long-text"></div>
                </div>
            </div>
            <br>
            <a id="card-back" href="javascript:void(0)" onclick="goListBack(event)">
            ← Back</a>
        </div>
<!-- ZA BACKA NA CARDA: style="display:inline-block; margin-bottom:15px; text-decoration:none; color:#4a90e2; font-weight:bold;"-->
        <div id="trainer-container" class="hidden">
            <div class="card">
                <h1 id="question-word-de"></h1>
                <input type="text" id="answer" placeholder="Answer here...">
                <button id="check-answer" onclick="TrainerButtonHandler()">Check Answer</button>
                <p id="feedback"></p>
            </div>
        </div>

        <div id="Home">
            <h1>Welcome to my app!</h1>
            <button onclick="HandleHomeNav('train')">train</button>
            <button onclick="HandleHomeNav('browse')">browse and search words</button>
        </div>
        <p id="error-msg" style="color:red" class="hidden"></p>
    </div>

    <template id="list-item-template">
        <li><strong class="de-text"></strong> - <span class="bg-text"></span></li>
    </template>

    <script src="script.js"></script>
</body>

</html>
